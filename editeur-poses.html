<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="favicon-nsf.png?v=1">
<title>Éditeur de poses — Nitro Surge Fighters</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  --bg: #121018; --panel: #1b1824; --panel2: #23202e; --line: #34303f; --txt: #ece8f4; --dim: #9a93aa;
  --acc: #ffb02e; --acc2: #ff6a1a; --ok: #4fd18b; --warn: #ffcf5a; --bad: #ff5a6a; --sel: #5ab8ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: grid; grid-template-columns: 260px 1fr 290px; grid-template-rows: 52px 1fr; height: 100vh; overflow: hidden; }
header { grid-column: 1 / 4; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 14px; margin: 0; letter-spacing: .04em; font-weight: 700; }
header h1 span { color: var(--acc); }
header .sp { flex: 1; }
.status { font-size: 12px; color: var(--dim); }
.status.dirty { color: var(--warn); }
.status.saved { color: var(--ok); }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 12px; }
aside.right { border-right: 0; border-left: 1px solid var(--line); }
label.h { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 14px 0 6px; }
label.h:first-child { margin-top: 0; }
select, input[type=search] { width: 100%; background: var(--panel2); color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font: inherit; }
.list { display: flex; flex-direction: column; gap: 2px; }
.act { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.act:hover { background: var(--panel2); }
.act.on { background: #2e2a3c; box-shadow: inset 2px 0 0 var(--acc); }
.act small { color: var(--dim); }
.act .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); align-self: center; flex: none; }
main { position: relative; display: flex; flex-direction: column; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
.chip { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.chip.on { border-color: var(--acc); color: var(--acc); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.wrap { position: relative; }
#view { image-rendering: pixelated; display: block; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
#ov { position: absolute; inset: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); cursor: pointer; font: inherit; }
.btn:hover { border-color: #4a4458; }
.btn.on { border-color: var(--acc); color: var(--acc); }
.btn.primary { background: linear-gradient(180deg, var(--acc), var(--acc2)); border-color: transparent; color: #1a1006; font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--panel2); color: var(--dim); padding: 7px 10px; font: inherit; cursor: pointer; }
.seg button.on { background: #2e2a3c; color: var(--acc); }
.full .seg { display: flex; } .full .seg button { flex: 1; }
.note { font-size: 12px; color: var(--dim); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-top: 8px; }
.note.warn { border-color: #5a4a1e; color: var(--warn); }
.note b { color: var(--txt); }
.joints { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 8px; font-size: 12px; }
.joints div { padding: 3px 4px; border-radius: 4px; cursor: pointer; }
.joints div.on { color: var(--sel); }
.joints .num { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row .btn { flex: 1; justify-content: center; }
.kbd { font-size: 11px; color: var(--dim); }
.empty { color: var(--dim); padding: 30px; text-align: center; }
#hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<!-- Éléments attendus par le moteur du jeu (invisibles ici) -->
<div id="hidden"><div id="app"><canvas id="game" width="384" height="216"></canvas>
<div id="touch"><div id="stickZone"><div id="stick"><div id="knob"></div></div></div><div id="startBtn"></div><div id="btnZone"><div id="btns"></div></div></div></div>
<div id="rotate"><button id="rotateOk" type="button"></button></div></div>

<header>
  <div id="pslot" style="display:flex"></div>
  <h1>NITRO SURGE FIGHTERS <span>— Éditeur de poses</span></h1>
  <div class="sp"></div>
  <span id="status" class="status">Aucune modification</span>
  <button class="btn" id="download" title="Télécharger poses-custom.js (copie pour ton Mac)" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
    Télécharger
  </button>
  <button class="btn primary" id="save" title="Enregistrer (Cmd + S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
    Enregistrer
  </button>
</header>

<aside>
  <label class="h">Personnage</label>
  <select id="char"></select>
  <label class="h">Action</label>
  <input type="search" id="search" placeholder="Filtrer (idle, punch…)">
  <div class="list" id="acts" style="margin-top:8px"></div>
</aside>

<main>
  <div class="chips" id="poses"></div>
  <div class="toolbar">
    <button class="btn" id="play" title="Lire l'action (Espace)">
      <svg id="playIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      <span>Lecture</span>
    </button>
    <div class="seg" id="view-dir"><button data-v="1" class="on">Vue droite</button><button data-v="-1">Vue gauche</button></div>
    <div class="seg" id="view-skin"><button data-v="0" class="on">Skin P1</button><button data-v="1">Skin P2</button></div>
    <button class="btn on" id="onion" title="Afficher la pose précédente en transparence">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      Pelure d'oignon
    </button>
    <button class="btn on" id="rigid" title="Les bras et les jambes gardent leur longueur quand tu déplaces une main, un pied, un coude ou un genou">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Membres fixes
    </button>
    <button class="btn on" id="bones" title="Afficher le squelette">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><circle cx="12" cy="12" r="2"/><path d="m6.5 7.5 4 3M13.5 13.5l4 3"/></svg>
      Squelette
    </button>
  </div>
  <div class="stage" id="stage">
    <div class="wrap" id="wrap"><canvas id="view"></canvas><svg id="ov"></svg></div>
  </div>
</main>

<aside class="right">
  <label class="h">Appliquer la modification à</label>
  <div class="full"><div class="seg" id="scope"><button data-v="char" class="on" id="scopeChar">Ce personnage</button><button data-v="tous">Tous les personnages</button></div></div>
  <div id="scopeNote" class="note"></div>
  <div id="patchNote" class="note warn" style="display:none"></div>
  <div id="usedNote" class="note"></div>

  <label class="h">Articulations</label>
  <div class="joints" id="joints"></div>
  <div class="kbd" style="margin-top:6px">Glisse un point sur le personnage. Flèches : déplacer d'un demi-point (Maj : 2 points).</div>

  <label class="h">Historique</label>
  <div class="row">
    <button class="btn" id="undo" title="Annuler (Cmd + Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Annuler</button>
    <button class="btn" id="redo" title="Rétablir (Cmd + Maj + Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>Rétablir</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button class="btn" id="reset" title="Revenir à la pose d'origine du jeu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Revenir à l'original</button>
  </div>
  <div id="saveNote" class="note" style="margin-top:14px"></div>
</aside>

    const a = Math.atan2(T[1] - R[1], T[0] - R[0]), M2 = [R[0] + Math.cos(a) * L1, R[1] + Math.sin(a) * L1];
    set(m, M2); set(e, [E[0] + M2[0] - M[0], E[1] + M2[1] - M[1]]); return out;
  }
  // main / pied : cinématique inverse à 2 segments, le coude garde son sens de pliure
  let dx = T[0] - R[0], dy = T[1] - R[1], d = Math.hypot(dx, dy) || 1e-6;
  const dm = Math.max(Math.abs(L1 - L2) + 1e-3, Math.min(L1 + L2 - 1e-3, d));
  const tx = R[0] + dx / d * dm, ty = R[1] + dy / d * dm;
  const side = Math.sign((M[0] - R[0]) * (E[1] - R[1]) - (M[1] - R[1]) * (E[0] - R[0])) || 1;
  const a = (L1 * L1 - L2 * L2 + dm * dm) / (2 * dm), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const ux = (tx - R[0]) / dm, uy = (ty - R[1]) / dm, px = R[0] + ux * a, py = R[1] + uy * a;
  let M2 = [px - uy * h, py + ux * h];
  const s2 = Math.sign((M2[0] - R[0]) * (ty - R[1]) - (M2[1] - R[1]) * (tx - R[0])) || 1;
  if (s2 !== side) M2 = [px + uy * h, py - ux * h];
  set(m, M2); set(e, [tx, ty]); return out;
}
let drag = null;
ov.addEventListener('pointerdown', e => {
  const j = e.target.dataset && e.target.dataset.j; if (j == null) { S.sel = -1; draw(); renderJoints(); return; }
  const it = itemWithState(curItem()); S.sel = +j;
  drag = { j: +j, it, start: poseArr(it.p).slice(), moved: false };
  ov.setPointerCapture(e.pointerId); e.preventDefault(); renderJoints(); draw();
});
ov.addEventListener('pointermove', e => {
  if (!drag) return;
  const r = view.getBoundingClientRect(), tx = (e.clientX - r.left) / r.width * N.SPR.width, ty = (e.clientY - r.top) / r.height * N.SPR.height;
  let arr = moveJoint(drag.j, tx, ty, drag.it, drag.start);
  if (S.rigid) arr = constrain(drag.j, [arr[drag.j * 2], arr[drag.j * 2 + 1]], drag.start).map(v => Math.round(v * 2) / 2);
  if (!drag.moved) { const key = editKey(); undo.push({ key, pn: drag.it.p, before: C[key] && C[key][drag.it.p] ? C[key][drag.it.p].slice() : null }); redo.length = 0; drag.moved = true; }
  apply(editKey(), drag.it.p, arr);
});
ov.addEventListener('pointerup', () => { drag = null; });
function nudge(dx, dy) {
  if (S.sel < 0 || !curItem()) return;
  const pn = curPose(), A = poseArr(pn); let arr = A.slice(); arr[S.sel * 2] += dx * (S.dir < 0 && def().kit !== 'grog' ? -1 : 1); arr[S.sel * 2 + 1] += dy;
  if (S.rigid) arr = constrain(S.sel, [arr[S.sel * 2], arr[S.sel * 2 + 1]], A).map(v => Math.round(v * 2) / 2);
  setPose(pn, arr, S.scope);
}
function doUndo(from, to) {
  const u = from.pop(); if (!u) return;
  to.push({ key: u.key, pn: u.pn, before: C[u.key] && C[u.key][u.pn] ? C[u.key][u.pn].slice() : null });
  apply(u.key, u.pn, u.before);
}

// ---------- interface ----------
const $ = id => document.getElementById(id);
function renderChars() {
  $('char').innerHTML = NAMES.map((n, i) => `<option value="${i}">${n.charAt(0) + n.slice(1).toLowerCase()}</option>`).join('');
  $('char').value = S.ci;
}
function actModified(a) { return a.q.some(it => isModified(S.ci, it.p)); }
function renderActs() {
  const q = $('search').value.trim().toLowerCase();
  const acts = actsOf(S.ci).filter(a => !q || a.s.toLowerCase().includes(q));
  $('acts').innerHTML = acts.map(a => {
    const [s, dbl] = a.s.split('#'), lab = s + (dbl ? ' <small>double</small>' : '');
    return `<div class="act ${a.s === S.act ? 'on' : ''}" data-a="${a.s}"><span>${lab}</span>${actModified(a) ? '<span class="dot" title="Pose modifiée"></span>' : `<small>${a.q.length}</small>`}</div>`;
  }).join('') || '<div class="empty">Aucune action</div>';
}
function renderPoses() {
  const a = curAct(); if (!a) { $('poses').innerHTML = ''; return; }
  $('poses').innerHTML = a.q.map((it, i) => `<span class="chip ${i === S.pi ? 'on' : ''}" data-i="${i}">${isModified(S.ci, it.p) ? '<span class="dot"></span>' : ''}${it.p}</span>`).join('');
}
function renderJoints() {
  const pn = curPose(); if (!pn) { $('joints').innerHTML = ''; return; }
  const arr = poseArr(pn), o = N.POSES[pn];
  $('joints').innerHTML = JN.map((n, i) => {
    const ch = o && (arr[i * 2] !== o[i * 2] || arr[i * 2 + 1] !== o[i * 2 + 1]);
    return `<div data-j="${i}" class="${i === S.sel ? 'on' : ''}">${ch ? '<b>' + n + '</b>' : n}</div><div class="num">${arr[i * 2]}</div><div class="num">${arr[i * 2 + 1]}</div>`;
  }).join('');
}
function usedIn(pn) {
  const out = [];
  NAMES.forEach((n, ci) => (META[n] || []).forEach(a => { if (a.q.some(it => it.p === pn)) out.push({ ci, s: a.s }); }));
  return out;
}
function renderNotes() {
  const pn = curPose(); if (!pn) return;
  const o = origin(pn), nm = name().charAt(0) + name().slice(1).toLowerCase();
  $('scopeChar').textContent = 'Seulement ' + nm;
  let t = '';
  if (S.scope === 'char') t = `La pose <b>${pn}</b> ne changera que pour <b>${nm}</b>.`;
  else t = `La pose <b>${pn}</b> changera pour <b>tous les personnages</b> qui l'utilisent.`;
  if (o === 'char' && S.scope === 'tous') t += ` <br>Attention : ${nm} a déjà sa propre version de cette pose, qui reste prioritaire pour lui.`;
  if (o) t += `<br>État : modifiée (${o === 'char' ? 'version ' + nm : 'version commune'}).`; else t += '<br>État : pose d\'origine du jeu.';
  $('scopeNote').innerHTML = t;
  const P = N.SPR_PATCH[name()], hasPatch = P && Object.keys(P).some(k => k.split('|')[0] === pn);
  $('patchNote').style.display = hasPatch ? '' : 'none';
  $('patchNote').innerHTML = `Cette pose a une <b>retouche Piskel</b> pour ${nm}. Si tu modifies la pose, la retouche est désactivée automatiquement (ses pixels ne tomberaient plus au bon endroit). « Revenir à l'original » la réactive.`;
  const u = usedIn(pn), chars = [...new Set(u.map(x => NAMES[x.ci]))];
  const here = u.filter(x => x.ci === S.ci).map(x => x.s.replace('#', ' '));
  $('usedNote').innerHTML = `Chez ${nm}, cette pose sert à : <b>${[...new Set(here)].join(', ') || '—'}</b>.<br>Personnages qui l'utilisent : ${chars.map(c => c.charAt(0) + c.slice(1).toLowerCase()).join(', ')}.`;
}
function renderStatus() {
  const st = $('status');
  st.className = 'status' + (S.dirty ? ' dirty' : fileHandle ? ' saved' : '');
  st.textContent = S.dirty ? 'Modifications non enregistrées' : fileHandle ? 'Enregistré' : 'Aucune modification';
  $('undo').disabled = !undo.length; $('redo').disabled = !redo.length;
  $('reset').disabled = !curPose() || !(C[editKey()] && C[editKey()][curPose()]);
}
function refreshAll() { renderActs(); renderPoses(); renderJoints(); renderNotes(); renderStatus(); draw(); }

$('char').addEventListener('change', e => { S.ci = +e.target.value; S.act = (actsOf(S.ci).find(a => a.s === S.act) || actsOf(S.ci).find(a => a.s === 'idle') || actsOf(S.ci)[0]).s; S.pi = 0; S.sel = -1; refreshAll(); });
$('search').addEventListener('input', renderActs);
$('acts').addEventListener('click', e => { const el = e.target.closest('.act'); if (!el) return; S.act = el.dataset.a; S.pi = 0; S.sel = -1; refreshAll(); });
$('poses').addEventListener('click', e => { const el = e.target.closest('.chip'); if (!el) return; S.pi = +el.dataset.i; refreshAll(); });
$('joints').addEventListener('click', e => { const el = e.target.closest('[data-j]'); if (!el) return; S.sel = +el.dataset.j; renderJoints(); draw(); });
for (const [id, k, conv] of [['view-dir', 'dir', Number], ['view-skin', 'alt', v => v === '1'], ['scope', 'scope', String]]) {
  $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S[k] = conv(b.dataset.v); $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); refreshAll(); });
}
$('onion').addEventListener('click', () => { S.onion = !S.onion; $('onion').classList.toggle('on', S.onion); draw(); });
$('rigid').addEventListener('click', () => { S.rigid = !S.rigid; $('rigid').classList.toggle('on', S.rigid); });
$('bones').addEventListener('click', () => { S.bones = !S.bones; $('bones').classList.toggle('on', S.bones); draw(); });
$('undo').addEventListener('click', () => doUndo(undo, redo));
$('redo').addEventListener('click', () => doUndo(redo, undo));
$('reset').addEventListener('click', () => { const pn = curPose(); if (pn) setPose(pn, null, S.scope); });

let playT = null;
function setPlay(on) {
  S.playing = on; clearInterval(playT);
  $('play').querySelector('span').textContent = on ? 'Pause' : 'Lecture';
  $('playIco').innerHTML = on ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' : '<polygon points="6 4 20 12 6 20 6 4"/>';
  if (on) playT = setInterval(() => { const a = curAct(); if (!a) return; S.pi = (S.pi + 1) % a.q.length; renderPoses(); draw(); }, 140);
  else refreshAll();
}
$('play').addEventListener('click', () => setPlay(!S.playing));

// ---------- enregistrement ----------
function fileText() {
  const clean = {}; for (const k of Object.keys(C).sort()) { if (!C[k] || !Object.keys(C[k]).length) continue; clean[k] = {}; for (const p of Object.keys(C[k]).sort()) clean[k][p] = C[k][p]; }
  const body = Object.keys(clean).length ? '{\n' + Object.entries(clean).map(([k, v]) => `  ${JSON.stringify(k)}: {\n` + Object.entries(v).map(([p, a]) => `    ${JSON.stringify(p)}: [${a.join(', ')}]`).join(',\n') + '\n  }').join(',\n') + '\n}' : '{}';
  return "// Poses modifiées avec l'éditeur de poses (editeur-poses.html).\n// Ce fichier est écrit par l'éditeur : ne pas le modifier à la main.\nwindow.NSF_POSES = " + body + ';\n';
}
function cleanPoses() { const o = {}; for (const k of Object.keys(C)) if (C[k] && Object.keys(C[k]).length) o[k] = C[k]; return o; }
async function publish() {
  if (!S.dirty) { $('saveNote').innerHTML = 'Rien à publier : aucune modification depuis la dernière publication.'; return; }
  $('save').disabled = true; $('status').textContent = 'Publication…';
  try {
    const summary = [...changed].slice(0, 12).join(', ') + (changed.size > 12 ? '…' : '');
    const r = await A.call('save', { poses: cleanPoses(), summary: summary || 'Modification des poses' });
    changed.clear(); S.dirty = false; renderStatus();
    $('status').className = 'status saved'; $('status').textContent = 'Publié sur GitHub';
    $('saveNote').innerHTML = 'Publié. Le jeu en ligne sera à jour d\'ici 1 à 2 minutes.' + (r.commit_url ? ' <a href="' + r.commit_url + '" target="_blank" style="color:var(--acc)">Voir sur GitHub</a>' : '') + '<br>Pense à <b>Télécharger</b> pour garder ton Mac à jour.';
  } catch (e) { $('status').className = 'status dirty'; $('status').textContent = 'Échec de la publication'; $('saveNote').innerHTML = '<span style="color:var(--bad)">' + A.esc(e.message) + '</span>'; }
  $('save').disabled = false;
}
function download() {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([fileText()], { type: 'text/javascript' })); a.download = 'poses-custom.js'; a.click();
}
async function save() {
  if (ONLINE) return publish();
  const text = fileText();
  if (window.showSaveFilePicker) {
    try {
      if (!fileHandle) fileHandle = await window.showSaveFilePicker({ suggestedName: 'poses-custom.js', types: [{ description: 'Poses du jeu', accept: { 'text/javascript': ['.js'] } }] });
      const w = await fileHandle.createWritable(); await w.write(text); await w.close();
      S.dirty = false; renderStatus();
      $('saveNote').innerHTML = 'Enregistré dans <b>' + fileHandle.name + '</b>. Recharge le jeu (index.html) pour voir le résultat.';
      return;
    } catch (e) { if (e && e.name === 'AbortError') return; fileHandle = null; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/javascript' })); a.download = 'poses-custom.js'; a.click();
  S.dirty = false; renderStatus();
  $('saveNote').innerHTML = 'Le fichier <b>poses-custom.js</b> a été téléchargé. Remplace celui du dossier du jeu par ce fichier.';
}
$('save').addEventListener('click', save);
$('download').addEventListener('click', download);
$('saveNote').innerHTML = 'Au premier enregistrement, choisis le fichier <b>poses-custom.js</b> du dossier du jeu et accepte de le remplacer. Les enregistrements suivants l\'écrasent directement.';
addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const mod = e.metaKey || e.ctrlKey, st = e.shiftKey ? 2 : .5;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  else if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doUndo(redo, undo) : doUndo(undo, redo); }
  else if (e.key === ' ') { e.preventDefault(); setPlay(!S.playing); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-st, 0); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(st, 0); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); nudge(0, -st); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); nudge(0, st); }
});

function boot() {
  renderChars();
  S.act = (actsOf(0).find(a => a.s === 'idle') || actsOf(0)[0]).s;
  refreshAll();
}
const A = window.NSFAuth, ONLINE = !!(A && A.ONLINE);
if (ONLINE) {
  document.body.style.visibility = 'hidden';
  A.require().then(async user => {
    document.body.style.visibility = '';
    A.profileButton($('pslot'), user, { beforeLogout: () => !S.dirty || confirm('Des modifications ne sont pas publiées. Se déconnecter quand même ?') });
    $('download').style.display = '';
    $('save').lastChild.textContent = ' Publier';
    $('save').title = 'Publier sur GitHub (Cmd + S)';
    $('saveNote').innerHTML = '<b>Publier</b> met à jour poses-custom.js sur GitHub : le jeu en ligne change d\'ici 1 à 2 minutes. <b>Télécharger</b> te donne une copie pour le dossier du jeu sur ton Mac.';
    boot();
    try {
      const r = await A.call('get');
      for (const k of Object.keys(C)) delete C[k];
      Object.assign(C, r.poses || {});
      S.dirty = false; refreshAll();
    } catch (e) { $('saveNote').innerHTML = '<span style="color:var(--warn)">' + A.esc(e.message) + '</span>'; }
  }).catch(e => { document.body.style.visibility = ''; alert(e.message); });
} else boot();
window.__EDITOR = { constrain, S, C, refreshAll, moveJoint, jointsPx, itemWithState, curItem, poseArr, fileText };
})();
